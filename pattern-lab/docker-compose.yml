# pattern-lab test environment — behavioural baselining
# ======================================================
#
#   [ trafficgen ] --> :8080 nginx + ModSecurity + OWASP CRS --> :9443 WSO2 IS 7.2
#                            (WAF in DetectionOnly during learning)  (real identity server)
#                                       |
#          request log (JSON, one/line) captured to ./capture/
#                                       |
#   [ dashboard :8050 ] <── engine learns baseline + scores mixed ──┘
#
# The workflow is POSITIVE SECURITY: observe legitimate traffic, learn the app's
# normal envelope, then hand the profile to Claude to lock the app down to it —
# on top of the CRS, which stays as the negative-security baseline.
#
#   docker compose up -d                                   # IS + WAF + sample SPA
#   docker compose --profile gen run --rm -e MODE=baseline trafficgen   # learn window
#   docker compose --profile gen run --rm -e MODE=mixed    trafficgen   # a day to score
#   docker compose --profile dash up -d dashboard          # http://localhost:8050
#   # or on the host:
#   python analyze.py --baseline capture/baseline.jsonl --score capture/mixed.jsonl --out out/
#
# NOTE: WSO2 IS 7.2 needs ~2 GB RAM and ~90s to boot. See README "Where this can fail".
services:
  wso2is:
    image: wso2/wso2is:7.2.0
    container_name: patternlab-is
    expose: ["9443"]
    ports: ["9443:9443"]
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sk https://localhost:9443/carbon/admin/login.jsp >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  waf:
    image: owasp/modsecurity-crs:nginx
    container_name: patternlab-waf
    depends_on:
      wso2is:
        condition: service_healthy
    environment:
      BACKEND: "https://wso2is:9443"
      PROXY_SSL_VERIFY: "off"
      PORT: "8080"
      # DetectionOnly during the learning window: we want to OBSERVE real
      # traffic shapes, not block them, while building the baseline.
      MODSEC_RULE_ENGINE: "DetectionOnly"
      PARANOIA: "1"
      # Emit a JSON access log (every request, allowed or not) in the engine's
      # schema to the shared ./capture volume. This is the production capture
      # point; nginx-log-format.conf defines the format.
    volumes:
      - ./capture:/capture
      - ./trafficgen/nginx-log-format.conf:/etc/nginx/templates/includes/00-req-json-log.conf.template:ro
    ports:
      - "8080:8080"

  sampleapp:
    image: nginx:alpine
    container_name: patternlab-spa
    volumes:
      - ./wso2-sample-app:/usr/share/nginx/html:ro
    ports: ["3000:80"]

  trafficgen:
    build: ./trafficgen
    container_name: patternlab-trafficgen
    depends_on: [waf]
    environment:
      TARGET: "http://waf:8080"
      MODE: "baseline"
      SESSIONS: "200"
    volumes:
      - ./capture:/capture
    profiles: ["gen"]

  dashboard:
    build: ./webapp
    container_name: patternlab-dashboard
    environment:
      BASELINE: "/capture/baseline.jsonl"
      SCORE: "/capture/mixed.jsonl"
    volumes:
      - ./capture:/capture:ro
      - ./engine:/app/engine:ro
    ports: ["8050:8050"]
    profiles: ["dash"]
