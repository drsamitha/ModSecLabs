# JSON access-log format for the WAF — the production capture point.
#
# Emits one JSON object per request in the schema pattern-lab's parser reads
# (method / request_uri / status / request_length / user_agent / remote_addr).
# Every request is logged, allowed or not — positive-security baselining needs
# to see normal traffic, not only what a signature flagged.
#
# This snippet must load in nginx's `http` context. In the owasp/modsecurity-crs
# image, mount it so it is included there (see docker-compose.yml). If your setup
# includes it in a `server` block instead, keep only the `access_log` line there
# and put `log_format` at http scope.
#
# NOTE: we log $http_x_forwarded_for because the traffic generator sets the
# simulated client IP there. In production, trust XFF only from your LB and log
# $remote_addr (or the real-IP module's result) instead — the per-client signal
# is only as good as the client IP you record.

log_format reqjson escape=json
  '{'
    '"ts":"$time_iso8601",'
    '"remote_addr":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"request_uri":"$request_uri",'
    '"status":$status,'
    '"request_length":$request_length,'
    '"user_agent":"$http_user_agent"'
  '}';

access_log /capture/access.jsonl reqjson;
