# WSO2 IS 7.3 + ModSecurity(CRS)/nginx + ELK
# --------------------------------------------------------------------------
#   client --HTTPS:8443--> [app: nginx+ModSecurity+CRS] --127.0.0.1:9443--> [WSO2 IS 7.3]
#                                    |                                          |
#                          modsec JSON audit log                    audit.log / auth events
#                                    |                                          |
#                                    v                                         v
#                              [logstash] <--------- shared log volumes -------+
#                                    |
#                                    v
#                             [elasticsearch] <--- [kibana :5601]
#
# Only :8080/:8443 (the WAF) are published to the host. WSO2 IS's own 9443 is
# intentionally NOT published -- all traffic must go through ModSecurity.
# --------------------------------------------------------------------------
services:
  app:
    build: .
    container_name: wso2is-modsec
    ports:
      - "8080:8080"   # HTTP  (through ModSecurity/CRS)
      - "8443:8443"   # HTTPS (through ModSecurity/CRS) -> WSO2 IS console/APIs
    volumes:
      - modsec-audit:/var/log/modsecurity/audit
      - wso2-logs:/home/wso2carbon/wso2is-7.3.0/repository/logs
    healthcheck:
      test: ["CMD", "curl", "-sk", "-o", "/dev/null", "https://localhost:8443/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.3
    container_name: logstash
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - modsec-audit:/var/log/modsecurity/audit:ro
      - wso2-logs:/var/log/wso2is:ro
    environment:
      - "LS_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "8084:8084"   # WSO2 IS event publisher posts auth events here

  kibana:
    image: kibana:8.15.3   # Docker Hub mirror of the official image (identical build)
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

volumes:
  modsec-audit:
  wso2-logs:
  es-data:
