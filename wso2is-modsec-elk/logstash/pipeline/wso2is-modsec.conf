# -----------------------------------------------------------------------------
# Logstash pipeline: three independent traffic sources feeding two ES indices.
#
#   1. ModSecurity's JSON audit log (one JSON object per logged transaction --
#      every request ModSecurity blocked or flagged) -> modsec-YYYY.MM.dd
#   2. WSO2 IS's audit.log (admin/user-management audit trail)     -> wso2is-audit-YYYY.MM.dd
#   3. WSO2 IS's real-time authentication events, POSTed directly by the
#      "OverallAuthentication" event publisher (see Dockerfile) over HTTP as
#      each login/auth attempt happens                             -> wso2is-auth-YYYY.MM.dd
#
# Sources 1 and 2 are read via the `file` input from a Docker volume shared
# with the app container (no Filebeat needed for a single-host lab -- direct
# Logstash file tailing is simpler and one less moving part).
# -----------------------------------------------------------------------------

input {
  file {
    path => "/var/log/modsecurity/audit/modsec_audit.log"
    start_position => "beginning"
    # No custom sincedb_path: use Logstash's own default writable data dir
    # (a mounted volume there needs the right uid, which is more fuss than
    # it's worth for a single-pipeline lab -- the default just works).
    codec => "json"
    tags => ["modsecurity"]
  }

  file {
    path => "/var/log/wso2is/audit.log"
    start_position => "beginning"
    tags => ["wso2is", "wso2is-audit"]
  }

  http {
    host => "0.0.0.0"
    port => 8084
    tags => ["wso2is", "wso2is-auth"]
  }
}

filter {
  if "modsecurity" in [tags] {
    # ModSecurity's time_stamp uses C-style padding, e.g. "Sat Aug  1 08:47:26
    # 2026" -- a double space before single-digit days. Squeeze to one space
    # so a single date pattern parses both single- and double-digit days.
    mutate {
      gsub => ["[transaction][time_stamp]", "  ", " "]
    }
    date {
      match => ["[transaction][time_stamp]", "EEE MMM d HH:mm:ss yyyy"]
      target => "@timestamp"
    }
    # Surface the fields you actually want to slice/filter on in Kibana.
    mutate {
      add_field => {
        "client_ip"   => "%{[transaction][client_ip]}"
        "request_uri" => "%{[transaction][request][uri]}"
        "http_code"   => "%{[transaction][response][http_code]}"
      }
    }
  }

  if "wso2is-audit" in [tags] {
    # WSO2 audit.log lines look like:
    #   [timestamp] ... INFO ... AUDIT_LOG ... {"actor": ..., "action": ...}
    grok {
      match => { "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\].*%{GREEDYDATA:audit_message}" }
      tag_on_failure => ["_wso2auditparsefailure"]
    }
  }

  if "wso2is-auth" in [tags] {
    # The event publisher POSTs a JSON body already -- Logstash's http input
    # parses it into the event automatically; nothing further needed here
    # beyond tagging, done above.
  }
}

output {
  if "modsecurity" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "modsec-%{+YYYY.MM.dd}"
    }
  } else if "wso2is-audit" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "wso2is-audit-%{+YYYY.MM.dd}"
    }
  } else if "wso2is-auth" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "wso2is-auth-%{+YYYY.MM.dd}"
    }
  }

  # Uncomment while building/debugging a new filter:
  # stdout { codec => rubydebug }
}
