; Runs nginx (+ModSecurity/CRS) and WSO2 IS 7.3 as sibling processes in one
; container. Logs go to real files under /var/log/supervisor/, /var/log/nginx/
; and repository/logs/ -- not /dev/stdout -- so this behaves like a real
; Ubuntu server you exec/root into and tail logs on, not a Docker-idiomatic
; single-process container.

[program:nginx]
; startretries bumped well above supervisords default (3): nginx was
; observed to occasionally fail its very first start attempt with a
; ModSecurity rules-file parse error that is not reproducible on a retry
; (same file, same content) -- almost certainly a filesystem-timing race
; between the bind-mounted rules directory settling and nginx's initial
; config read, not a real config error. autorestart plus a generous
; startretries lets it self-heal instead of the whole container going down.
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=20
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
priority=10

[program:wso2is]
; No arguments -> wso2server.sh's default "RUN" mode, which execs the JVM in
; the FOREGROUND (see bin/wso2server.sh). Passing "start" instead backgrounds
; it via `nohup ... &` and exits 0 immediately -- exactly the failure mode
; supervisord reports as "exited: wso2is (exit status 0; not expected)".
command=/home/wso2carbon/wso2is-7.3.0/bin/wso2server.sh
user=wso2carbon
directory=/home/wso2carbon
environment=HOME="/home/wso2carbon",JAVA_HOME="/opt/java/openjdk",WSO2_SERVER_HOME="/home/wso2carbon/wso2is-7.3.0",WORKING_DIRECTORY="/home/wso2carbon"
autostart=true
autorestart=true
startsecs=45
stdout_logfile=/var/log/supervisor/wso2is.out.log
stderr_logfile=/var/log/supervisor/wso2is.err.log
priority=20
