# -----------------------------------------------------------------------------
# Stage 3 -- CRS tuned for IAM/OAuth traffic (verified false positive fix)
# -----------------------------------------------------------------------------
# REPRODUCED false positive: a completely legitimate OAuth2 refresh-token
# request --
#   grant_type=refresh_token&refresh_token=<JWT>&client_id=my_client
#     &client_secret=SuperSecretValue123!@#
# -- gets blocked (403) by default CRS. The culprit is rule 942100
# (libinjection SQLi), which matches inside the ARGS:client_secret value
# "SuperSecretValue123!@#" (verified via the audit log: "Matched Data: novc
# found within ARGS:client_secret"). High-entropy secrets/tokens with special
# characters are exactly the shape libinjection sometimes mistakes for SQL.
#
# Fix: the SAME narrow-exclusion pattern taught in the beginner course (Lab
# 07) -- scope the exclusion to the exact rule, the exact argument, and the
# exact path. Do NOT disable 942100 globally: it still protects every other
# endpoint, and even /oauth2/token itself for every OTHER argument.
# -----------------------------------------------------------------------------

SecRule REQUEST_URI "@beginsWith /oauth2/token" \
    "id:1900101,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetById=942100;ARGS:client_secret,\
     ctl:ruleRemoveTargetById=942100;ARGS:refresh_token,\
     ctl:ruleRemoveTargetById=942100;ARGS:code"

# SCIM2 filter syntax (userName eq "alice" and active eq true) uses operator
# keywords (eq, sw, co, and, or) that read like SQL boolean logic to CRS's
# generic SQLi rules. Scope the same way: only the `filter` argument, only on
# /scim2/*.
SecRule REQUEST_URI "@beginsWith /scim2" \
    "id:1900102,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetById=942100;ARGS:filter,\
     ctl:ruleRemoveTargetById=942190;ARGS:filter"
