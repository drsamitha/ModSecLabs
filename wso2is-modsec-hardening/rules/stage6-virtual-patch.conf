# -----------------------------------------------------------------------------
# Stage 6 (capstone) -- Virtual-patch a path-normalization bypass of Stage 5
# -----------------------------------------------------------------------------
# Real disclosed WSO2 vulnerabilities in this exact class exist (see the
# README for CVE references) -- flawed regex/prefix-based access control
# combined with a path-normalization mismatch between the enforcement point
# and the backend that actually serves the request. Rather than fabricate an
# unverified CVE proof-of-concept, this stage reproduces and fixes the
# underlying vulnerability CLASS directly against Stage 5's own allow-list
# rule, verified live:
#
#   curl https://.../carbon/admin/login.jsp              -> 403 (blocked, as intended)
#   curl https://...//carbon/admin/login.jsp              -> 401 (BYPASSED -- reached WSO2 itself)
#
# The double leading slash means REQUEST_URI literally starts with
# "//carbon", not "/carbon", so a naive @beginsWith check misses it -- but
# nginx/Tomcat normalize the path and route it to the real admin endpoint
# anyway. The 401 (a real WSO2 JSON response, not nginx's 403 page) proves
# the request reached the backend unauthenticated.
#
# The fix: apply ModSecurity's t:normalizePath transformation to REQUEST_URI
# before matching, so the rule sees the SAME normalized path the backend
# will act on. This is the general defense for the whole vulnerability class,
# not just this one payload -- verified it also closes a dot-segment variant
# (/foo/../carbon/...) with the same one-line change.
# -----------------------------------------------------------------------------

SecRule REMOTE_ADDR "@ipMatch 172.17.0.1,127.0.0.1" \
    "id:1900400,\
     phase:1,\
     pass,\
     nolog,\
     skipAfter:END_ADMIN_ALLOWLIST_PATCHED"

SecRule REQUEST_URI "@beginsWith /carbon" \
    "id:1900401,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     t:normalizePath,\
     msg:'Admin console access denied: source IP not in the admin allow-list'"

SecRule REQUEST_URI "@beginsWith /console" \
    "id:1900402,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     t:normalizePath,\
     msg:'Admin console access denied: source IP not in the admin allow-list'"

SecRule REQUEST_URI "@beginsWith /api/server/" \
    "id:1900403,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     t:normalizePath,\
     msg:'Management REST API access denied: source IP not in the admin allow-list'"

SecMarker END_ADMIN_ALLOWLIST_PATCHED
