# Real CRS false positive, found and verified via controlled A/B testing
# (fresh containers, headless-Chromium logins, isolating one variable at a
# time -- not guessed): CRS rule 930130 ("Restricted File Access Attempt",
# REQUEST-930-APPLICATION-ATTACK-LFI.conf) flags any request whose
# REQUEST_FILENAME matches its restricted-files.data patterns, which
# include a generic "config.json" match. WSO2 IS's Console React SPA
# legitimately, unauthenticated, fetches /console/deployment.config.json
# on every page load -- CRS blocks it with a 403, which crashes the SPA's
# init code (`Cannot read properties of undefined (reading 'skipTenant')`)
# before it can render anything.
#
# This is the actual, confirmed, necessary-and-sufficient fix for the
# WSO2 IS Console "stuck behind a WAF" symptom in this lab series --
# proven via four separate controlled tests (nginx+CRS baseline vs.
# Apache with no CRS vs. nginx+CRS with only this exclusion vs.
# nginx+CRS with only proxy-header fixes) that isolated this specific
# rule/path pair as the one variable that determines success or failure.
SecRule REQUEST_URI "@endsWith /console/deployment.config.json" \
    "id:1900600,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveById=930130"
