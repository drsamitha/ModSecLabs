# -----------------------------------------------------------------------------
# Stage 5 -- Restrict the admin console/management surface to allow-listed IPs
# -----------------------------------------------------------------------------
# /carbon (legacy admin console) and /console (React admin console) are
# high-value, low-traffic targets: exactly the profile where a stricter,
# deny-by-default posture is appropriate, per the hardening research -- this
# is the one place a WAF operator should turn UP paranoia, unlike the public
# IAM endpoints in Stage 3 where over-blocking hurts real users.
#
# The IP list below is a placeholder: replace it with your real admin
# network or VPN range before using this anywhere but this lab. The Docker
# default bridge gateway (172.17.0.1) is allow-listed here purely so curl run
# on the host machine can demonstrate the allowed path without extra network
# setup.
#
# IMPLEMENTATION NOTE: this uses skipAfter/SecMarker instead of chain for the
# allow/deny logic below. Empirically, this specific engine build fails to
# parse its OWN bundled rules the moment a custom rules file adds a second
# top-level chained rule anywhere in the loaded set -- confirmed by minimal
# reproduction (two trivial chain rules, unrelated content, broke parsing;
# splitting them into separate files did not help; a single chain rule was
# fine). skipAfter+SecMarker expresses the same allow-list-then-deny logic
# without chain and was verified stable across repeated fresh container
# starts.
# -----------------------------------------------------------------------------

SecRule REMOTE_ADDR "@ipMatch 172.17.0.1,127.0.0.1" \
    "id:1900300,\
     phase:1,\
     pass,\
     nolog,\
     skipAfter:END_ADMIN_ALLOWLIST"

SecRule REQUEST_URI "@beginsWith /carbon" \
    "id:1900301,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'Admin console access denied: source IP not in the admin allow-list'"

SecRule REQUEST_URI "@beginsWith /console" \
    "id:1900302,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'Admin console access denied: source IP not in the admin allow-list'"

# Management REST APIs (SCIM2 admin-level bulk ops, server-configuration
# APIs) are just as sensitive as the admin UI and easy to forget -- lock them
# down the same way.
SecRule REQUEST_URI "@beginsWith /api/server/" \
    "id:1900303,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'Management REST API access denied: source IP not in the admin allow-list'"

SecMarker END_ADMIN_ALLOWLIST
