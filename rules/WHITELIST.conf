# ---------------------------------------------------------------------------
# ModSecLabs whitelisting examples (Lab 09)
# "Whitelisting" = telling the WAF NOT to block something it otherwise would.
# These directives are evaluated at config-load time and apply globally.
# Place this file so it loads BEFORE the CRS rule it disables (900-series).
# ---------------------------------------------------------------------------

# 1. Whitelist a single rule ID globally.
#    Rule 942100 (libinjection SQLi) false-positives on our product search.
#    This removes it EVERYWHERE. Simple, blunt -- use only when you accept the
#    loss of that one rule across the whole site.
SecRuleRemoveById 942100

# 2. Whitelist a RANGE of rule IDs (inclusive).
#    Example: silence a noisy block of protocol-enforcement rules.
SecRuleRemoveById 920200-920210

# 3. Whitelist every rule carrying a given tag.
#    Example below is commented out -- uncommenting it would disable the whole
#    SQLi family, which you almost never want. Shown for completeness.
# SecRuleRemoveByTag "attack-sqli"
