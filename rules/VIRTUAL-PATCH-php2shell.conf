# ---------------------------------------------------------------------------
# ModSecLabs virtual patch: "PHP2Shell" (CVE-2026-109618 / CVE-2026-109619)
#
# NOTE ON CVE STATUS: these IDs could not be independently verified at the
# time this rule was written (numbering is unusually high) — treated as
# UNVERIFIED per this repo's "verify, don't trust" policy. What *is* real and
# testable is the HTTP-level mechanism the public PoC depends on:
#   1. A multipart/form-data POST with an abnormally large number of fields
#      (or abnormally long field names/values) to push PHP's multipart parser
#      into a heap-spray / pointer-leak state (the "OOM" half of the name).
#   2. A PHP tag smuggled into a request header (classically User-Agent),
#      relying on the header being written verbatim into a log file that is
#      later include()'d — log poisoning -> LFI -> RCE (the "RCE" half).
#
# This rule replaces an earlier draft that had several bugs: a non-existent
# "OR" action (chains are AND-only), a second chain with no `id` (fatal
# config-load error), and a body-size check against the wrong variable
# (`ARGS` holds a parameter *value*, not the request size).
#
# Design borrows two tricks from how AWS WAF / Cloudflare WAF virtual-patch
# CVEs in their managed rule groups, instead of one brittle hard-match rule:
#   - Composite scoring: several independent, non-blocking signals each add
#     to tx.php2shell_score; only the combined score blocks (CRS-style
#     anomaly scoring, analogous to AWS WAF's rule composition via labels).
#   - Request+response correlation with a timed IP quarantine: a flagged
#     request alone only raises suspicion; if the *response* then shows the
#     backend actually choked (5xx + a PHP fatal-error/segfault signature),
#     that source IP is escalated to a short hard quarantine so further
#     probing is cheaply blocked at phase:1 — the ModSecurity analogue of a
#     cloud WAF's rate-based/adaptive mitigation escalating after confirmed
#     bad behaviour, rather than guessing from the request alone.
#
# Requires SecResponseBodyAccess On (and text/html, text/plain in
# SecResponseBodyMimeType) for the phase:4 correlation rule to see
# RESPONSE_BODY at all — confirm this is enabled in the WAF container before
# relying on rule 1000919.
# ---------------------------------------------------------------------------

# --- tunables, mirrors crs-setup.conf's own style of exposed thresholds ---
SecAction \
    "id:1000910,\
     phase:1,\
     nolog,\
     pass,\
     initcol:ip=%{REMOTE_ADDR},\
     setvar:'tx.php2shell_max_args=255',\
     setvar:'tx.php2shell_arg_length=400',\
     setvar:'tx.php2shell_body_limit=2000000',\
     setvar:'tx.php2shell_score_threshold=5',\
     setvar:'tx.php2shell_score=0'"

# --- phase:1 fast-path: a source IP already confirmed (via response
# correlation, rule 1000919) is quarantined cheaply, before full inspection ---
SecRule IP:php2shell_confirmed "@eq 1" \
    "id:1000911,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'PHP2Shell: request blocked, source IP under active quarantine (CVE-2026-109618/9)',\
     tag:'cve-2026-109618',tag:'cve-2026-109619',\
     severity:'CRITICAL'"

# --- phase:2 scoring signals: each independently re-gates on the .php
# endpoint and only adds to the composite score, it does not block alone ---
SecRule REQUEST_FILENAME "@rx \.php(/|$)" \
    "id:1000912,\
     phase:2,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell signal: PHP_SESSION_UPLOAD_PROGRESS marker present on PHP request',\
     tag:'cve-2026-109618',\
     setvar:'tx.php2shell_score=+3'"
    SecRule ARGS|ARGS_NAMES|REQUEST_BODY "@contains PHP_SESSION_UPLOAD_PROGRESS" "t:none"

SecRule REQUEST_FILENAME "@rx \.php(/|$)" \
    "id:1000913,\
     phase:2,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell signal: excessive argument count (possible heap-spray flood)',\
     tag:'cve-2026-109618',\
     setvar:'tx.php2shell_score=+4'"
    SecRule &ARGS "@gt %{tx.php2shell_max_args}"

SecRule REQUEST_FILENAME "@rx \.php(/|$)" \
    "id:1000914,\
     phase:2,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell signal: oversized individual argument value',\
     tag:'cve-2026-109618',\
     setvar:'tx.php2shell_score=+2'"
    SecRule ARGS "@gt %{tx.php2shell_arg_length}" "t:length"

SecRule REQUEST_FILENAME "@rx \.php(/|$)" \
    "id:1000915,\
     phase:2,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell signal: oversized multipart body (possible OOM attempt)',\
     tag:'cve-2026-109618',\
     setvar:'tx.php2shell_score=+3'"
    SecRule REQUEST_HEADERS:Content-Type "@startsWith multipart/form-data" "chain"
        SecRule REQUEST_HEADERS:Content-Length "@gt %{tx.php2shell_body_limit}"

SecRule REQUEST_FILENAME "@rx \.php(/|$)" \
    "id:1000916,\
     phase:2,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell signal: request body could not be fully parsed/buffered (oversize or malformed multipart)',\
     tag:'cve-2026-109618',\
     setvar:'tx.php2shell_score=+3'"
    SecRule REQBODY_ERROR "!@eq 0"

# --- hard block, independent of score: a PHP tag in a request header is
# unambiguous (same scope CRS's own 933100 uses: any header except Cookie) ---
SecRule REQUEST_HEADERS:User-Agent|REQUEST_HEADERS:Referer "@rx <\?php" \
    "id:1000917,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     msg:'PHP2Shell: PHP tag in request header, log-poisoning/RCE attempt blocked',\
     tag:'cve-2026-109619',\
     severity:'CRITICAL'"

# --- aggregate: block this request once the composite score crosses the
# threshold, and soft-flag the source IP for a short window ---
SecRule TX:php2shell_score "@gt %{tx.php2shell_score_threshold}" \
    "id:1000918,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     msg:'PHP2Shell composite score %{tx.php2shell_score} exceeded threshold (CVE-2026-109618/9)',\
     tag:'cve-2026-109618',tag:'cve-2026-109619',\
     severity:'CRITICAL',\
     setvar:'ip.php2shell_suspect=1',\
     expirevar:'ip.php2shell_suspect=300'"

# --- phase:4 request+response correlation: only a transaction already
# flagged in phase:2 is checked; if the response then shows the backend
# actually choked, escalate the source IP to a 1-hour hard quarantine ---
SecRule TX:php2shell_score "@gt 0" \
    "id:1000919,\
     phase:4,\
     chain,\
     pass,\
     log,\
     msg:'PHP2Shell exploitation CONFIRMED via response correlation, quarantining source IP for 1h',\
     tag:'cve-2026-109618',tag:'cve-2026-109619',\
     severity:'CRITICAL',\
     setvar:'ip.php2shell_confirmed=1',\
     expirevar:'ip.php2shell_confirmed=3600'"
    SecRule RESPONSE_STATUS "@rx ^5" "chain"
        SecRule RESPONSE_BODY "@rx (?i)(allowed memory size|segmentation fault|core dumped|fatal error:|stack trace:)"
