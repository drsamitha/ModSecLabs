# ---------------------------------------------------------------------------
# ModSecLabs targeted rule exclusions (Lab 07)
# Loaded as REQUEST-900-* so it runs BEFORE the CRS detection rules and can
# tell them to skip a specific argument on a specific path.
# ---------------------------------------------------------------------------

# The /search box legitimately contains words like "select ... from".
# Rule 942100 (libinjection SQLi) false-positives on it. Instead of disabling
# SQLi detection globally, we remove ONLY the `q` argument from ONLY rule
# 942100 and ONLY on the /search URI. Every other rule, arg and path still
# gets full SQLi protection.
SecRule REQUEST_URI "@beginsWith /search" \
    "id:1900001,\
     phase:1,\
     pass,\
     nolog,\
     ctl:ruleRemoveTargetById=942100;ARGS:q"
