# ---------------------------------------------------------------------------
# ModSecLabs custom rules (Lab 06)
# Loaded from /etc/modsecurity.d/owasp-crs/rules/ so it runs alongside CRS.
# Custom rule IDs must live in the 1,000,000-1,999,999 range (reserved for
# local rules so they never collide with CRS).
# ---------------------------------------------------------------------------

# Rule 1: hard block any access to /admin (app has no business exposing it).
SecRule REQUEST_URI "@beginsWith /admin" \
    "id:1000001,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'ModSecLabs: access to /admin blocked',\
     tag:'local-policy'"

# Rule 2: block a forbidden custom header value (e.g. a deprecated debug flag).
SecRule REQUEST_HEADERS:X-Debug "@streq enable" \
    "id:1000002,\
     phase:1,\
     deny,\
     status:403,\
     log,\
     msg:'ModSecLabs: X-Debug header not allowed'"

# Rule 3: CHAINED rule -- only block POST /api/log when the data arg
# contains the word 'secret'. Both conditions must be true.
SecRule REQUEST_METHOD "@streq POST" \
    "id:1000003,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     msg:'ModSecLabs: secret leak attempt on /api/log',\
     chain"
    SecRule ARGS:data "@rx (?i)secret" "t:none,t:lowercase"

# Rule 4: contribute to the CRS anomaly score instead of hard-blocking.
# Adds 5 (critical) to the inbound score when a fake scanner UA is seen; the
# request is blocked only if the TOTAL score crosses the threshold (949110).
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)evil-scanner" \
    "id:1000004,\
     phase:2,\
     pass,\
     log,\
     msg:'ModSecLabs: suspicious scanner UA (scored, not hard-blocked)',\
     setvar:'tx.inbound_anomaly_score_pl1=+5'"
