# ---------------------------------------------------------------------------
# ModSecLabs virtual patch: Log4Shell / CVE-2021-44228 (Lab 08)
# A "virtual patch" is a WAF rule that blocks exploitation of a specific known
# vulnerability so you are protected BEFORE you can upgrade the vulnerable
# software. This is the single most valuable thing a WAF does in a real
# incident: on 2021-12-10 this rule (or one like it) bought teams the days
# they needed to patch Log4j across their estate.
#
# It matches the JNDI lookup pattern that triggers the exploit, in ALL request
# locations (URI, args, headers, body), after normalising case and encoding.
# ---------------------------------------------------------------------------
SecRule REQUEST_URI|REQUEST_HEADERS|ARGS|REQUEST_BODY \
    "@rx (?i)\$\{[^}]{0,80}(?:jndi|ldap|rmi|dns|nis|iiop|corba|nds|http):" \
    "id:1000900,\
     phase:2,\
     deny,\
     status:403,\
     log,\
     t:none,t:urlDecodeUni,t:lowercase,\
     msg:'ModSecLabs VIRTUAL PATCH: Log4Shell CVE-2021-44228 JNDI lookup blocked',\
     tag:'cve-2021-44228',\
     severity:'CRITICAL'"
