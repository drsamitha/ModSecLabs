# ---------------------------------------------------------------------------
# ModSecLabs trusted-IP allowlist (Lab 09)
# Turn the rule engine OFF for a trusted source (an internal QA scanner, a
# monitoring probe, a partner integration) so its requests are never blocked.
# Uses ctl:ruleEngine=DetectionOnly so we still LOG what it sends.
# ---------------------------------------------------------------------------
SecRule REMOTE_ADDR "@ipMatch 172.17.0.1" \
    "id:1900010,\
     phase:1,\
     pass,\
     nolog,\
     msg:'ModSecLabs: trusted source, engine set to DetectionOnly',\
     ctl:ruleEngine=DetectionOnly"
